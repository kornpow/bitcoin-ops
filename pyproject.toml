[project]
name = "bitcoin-ops"
version = "0.1.0"
description = "Create, sign, inspect, and broadcast Bitcoin data transactions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "embit>=0.8.0",
    "requests>=2.34.2",
]

[project.scripts]
bitcoin-ops = "bitcoin_ops.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "prek>=0.4.12",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
